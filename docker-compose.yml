services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: syncora
      POSTGRES_USER: syncora
      POSTGRES_PASSWORD: syncora_dev
    ports: ["5432:5432"]
    volumes: ["syncora_pg:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U syncora"], interval: 5s, timeout: 5s, retries: 10 }
  audit:
    build: apps/services/Syncora.Audit
    environment:
      ASPNETCORE_URLS: http://+:8501
      AUDIT_DATABASE_URL: Host=postgres;Port=5432;Database=syncora;Username=syncora;Password=syncora_dev
      AUDIT_SERVICE_KEY: development-audit-key
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8501:8501"]
  api:
    build: apps/api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://syncora:syncora_dev@postgres:5432/syncora
      JWT_SECRET: development-compose-secret-change-before-production
      CORS_ORIGINS: http://localhost:8600
      AUDIT_SERVICE_URL: http://audit:8501
      AUDIT_SERVICE_KEY: development-audit-key
    depends_on: { postgres: { condition: service_healthy }, audit: { condition: service_started } }
    ports: ["8500:8500"]
  web:
    build: { context: apps/web, args: { VITE_API_URL: http://localhost:8500 } }
    depends_on: [api]
    ports: ["8600:8600"]
volumes: { syncora_pg: {} }
