<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Syncora loading">
  <defs>
    <linearGradient id="blue" x1="18" y1="18" x2="92" y2="96" gradientUnits="userSpaceOnUse"><stop stop-color="#37dcff"/><stop offset=".42" stop-color="#1687ec"/><stop offset="1" stop-color="#2834b8"/></linearGradient>
    <linearGradient id="violet" x1="35" y1="15" x2="104" y2="98" gradientUnits="userSpaceOnUse"><stop stop-color="#3631dd"/><stop offset=".52" stop-color="#7c42f5"/><stop offset="1" stop-color="#d18cff"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white" stop-opacity=".8"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <clipPath id="mark"><path d="M88 18H47c-15 0-21 19-8 27l42 25c13 8 7 28-8 28H31"/><path d="M31 22h40c15 0 21 19 8 27L38 73c-13 8-7 27 8 27h42"/></clipPath>
  </defs>
  <g fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path class="ribbon ribbon-blue" stroke="url(#blue)" d="M31 22h40c15 0 21 19 8 27L38 73c-13 8-7 27 8 27h42"/>
    <path class="ribbon ribbon-violet" stroke="url(#violet)" d="M88 18H47c-15 0-21 19-8 27l42 25c13 8 7 28-8 28H31"/>
  </g>
  <rect class="shine" x="-45" y="0" width="34" height="120" fill="url(#shine)" clip-path="url(#mark)" transform="skewX(-18)"/>
  <style>
    .ribbon{stroke-dasharray:190;stroke-dashoffset:190;animation:draw 1.8s cubic-bezier(.4,0,.2,1) infinite}
    .ribbon-violet{animation-delay:.16s}.shine{animation:shine 1.8s ease-in-out infinite;animation-delay:.72s}
    @keyframes draw{0%{stroke-dashoffset:190;opacity:.35}42%,82%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.35}}
    @keyframes shine{0%,42%{transform:translateX(0) skewX(-18deg);opacity:0}58%{opacity:.9}82%,100%{transform:translateX(190px) skewX(-18deg);opacity:0}}
    @media(prefers-reduced-motion:reduce){.ribbon{animation:none;stroke-dashoffset:0;opacity:1}.shine{display:none}}
  </style>
</svg>
